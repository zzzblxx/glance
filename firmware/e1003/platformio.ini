[env:e1003]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
extra_scripts = pre:prepare_assets.py
board_build.embed_files = generated/unifont16.bin
monitor_speed = 115200
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -I../shared
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  https://github.com/Seeed-Studio/Seeed_GFX2/archive/8d7d14d4e2899a9451fef319035bad8eba1d3213.zip
  bblanchon/ArduinoJson@7.4.2
